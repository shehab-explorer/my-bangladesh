<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY Memory</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #667eea;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--primary-gradient);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }

        .upload-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 2.5rem;
        }

        .upload-section h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: var(--border-radius);
            padding: 2rem;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.25rem;
        }

        .drop-zone.dragover {
            border-color: var(--accent-color);
            background: #f0f4ff;
        }

        .drop-zone p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 90px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0.8rem 1.75rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .gallery-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .memory-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .memory-card:hover {
            transform: translateY(-4px);
        }

        .memory-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #f1f5f9;
        }

        .memory-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .memory-comment {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.5;
            word-break: break-word;
        }

        /* Loading spinner style */
        .loading {
            display: none;
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-top: 0.5rem;
            font-weight: 500;
        }

        footer {
            background: #1e293b;
            color: #94a3b8;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            margin-top: auto;
        }

        footer span {
            color: #ffffff;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>MY Memory</h1>
        <p>Capture and preserve your favorite moments</p>
    </header>

    <div class="container">
        
        <section class="upload-section">
            <h2>Add a New Memory</h2>
            <form id="memoryForm">
                <div class="drop-zone" id="dropZone">
                    <p id="dropText">Drag & drop an image here, or <strong>click to browse</strong></p>
                    <input type="file" id="imageInput" accept="image/*">
                </div>

                <div class="form-group">
                    <textarea id="commentInput" placeholder="Write a comment about this memory..." required></textarea>
                </div>

                <button type="submit" class="btn" id="submitBtn">Upload Memory</button>
                <div class="loading" id="loadingText">Uploading to Firebase, please wait...</div>
            </form>
        </section>

        <section>
            <h2 class="gallery-title">Memory Gallery</h2>
            <div class="gallery-grid" id="galleryGrid">
                <p id="statusMsg" style="color: var(--text-muted);">Loading memories...</p>
            </div>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 MY Memory. Design by <span>Shehabuzzaman</span>.</p>
    </footer>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // ==========================================
        // আপনার ফায়ারবেস কনফিগারেশন এখানে বসান 👇
         // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCnQRPorqvRvIGpGjwKaj-LKPADM1BGJH0",
  authDomain: "mymemory-6dcdd.firebaseapp.com",
  projectId: "mymemory-6dcdd",
  storageBucket: "mymemory-6dcdd.firebasestorage.app",
  messagingSenderId: "90480740636",
  appId: "1:90480740636:web:2d9f42dc1af764781912d9",
  measurementId: "G-ZNSLFHB3LC"
};
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const dropZone = document.getElementById('dropZone');
        const imageInput = document.getElementById('imageInput');
        const dropText = document.getElementById('dropText');
        const memoryForm = document.getElementById('memoryForm');
        const commentInput = document.getElementById('commentInput');
        const galleryGrid = document.getElementById('galleryGrid');
        const submitBtn = document.getElementById('submitBtn');
        const loadingText = document.getElementById('loadingText');
        const statusMsg = document.getElementById('statusMsg');

        let selectedFile = null;

        // পেজ লোড হওয়ার সাথে সাথে ডাটাবেস থেকে মেমরিগুলো ফেচ করা
        window.addEventListener('DOMContentLoaded', fetchMemories);

        dropZone.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                dropText.innerHTML = `Selected: <strong>${selectedFile.name}</strong>`;
            }
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                selectedFile = files[0];
                dropText.innerHTML = `Selected: <strong>${selectedFile.name}</strong>`;
            } else {
                alert('Please drop a valid image file.');
            }
        });

        // ফর্ম সাবমিট হ্যান্ডলার (ফায়ারবেসে আপলোড করা)
        memoryForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!selectedFile) {
                alert('Please select or drop an image first.');
                return;
            }

            const commentText = commentInput.value.trim();
            if (!commentText) {
                alert('Please write a comment.');
                return;
            }

            // বাটন ডিজেবল এবং লোডিং টেক্সট শো করা
            submitBtn.disabled = true;
            loadingText.style.display = 'block';

            try {
                // ১. ফায়ারবেস স্টোরেজে ছবি আপলোড করা
                const storageRef = ref(storage, 'memories/' + Date.now() + '_' + selectedFile.name);
                const snapshot = await uploadBytes(storageRef, selectedFile);
                const downloadURL = await getDownloadURL(snapshot.ref);

                // ২. ফায়ারস্টোর ডাটাবেসে ইমেজ লিংক ও কমেন্ট সেভ করা
                await addDoc(collection(db, "memories"), {
                    imageUrl: downloadURL,
                    comment: commentText,
                    createdAt: Date.now()
                });

                // ফর্ম রিসেট করা এবং গ্যালারি রিফ্রেশ করা
                resetForm();
                fetchMemories();
            } catch (error) {
                console.error("Error uploading memory: ", error);
                alert('Failed to upload memory. Please check your Firebase configuration.');
            } finally {
                submitBtn.disabled = false;
                loadingText.style.display = 'none';
            }
        });

        // ফায়ারস্টোর থেকে সব মেমরি রিড করে ওয়েবসাইটে দেখানো
        async function fetchMemories() {
            try {
                const q = query(collection(db, "memories"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                galleryGrid.innerHTML = '';
                
                if (querySnapshot.empty) {
                    galleryGrid.innerHTML = `<p id="statusMsg" style="color: var(--text-muted);">No memories found yet. Add your first one above!</p>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    renderMemoryCard(data.imageUrl, data.comment);
                });
            } catch (error) {
                console.error("Error fetching memories: ", error);
                statusMsg.textContent = "Could not load memories. Please verify your Firebase setup.";
            }
        }

        function renderMemoryCard(imgSrc, comment) {
            const card = document.createElement('div');
            card.className = 'memory-card';
            card.imageUrl = imgSrc; // store reference if needed
            card.innerHTML = `
                <img src="${imgSrc}" alt="Memory Image">
                <div class="memory-content">
                    <p class="memory-comment">${escapeHtml(comment)}</p>
                </div>
            `;
            galleryGrid.appendChild(card);
        }

        function resetForm() {
            selectedFile = null;
            imageInput.value = '';
            commentInput.value = '';
            dropText.innerHTML = 'Drag & drop an image here, or <strong>click to browse</strong>';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }



    </script>
</body>
</html>
